        stroke="#fafafc" stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round" fill="none"/>
  <line x1="14" y1="9" x2="28" y2="9"
        stroke="#fafafc" stroke-width="2.2"
        stroke-linecap="round"/>
  <line x1="14" y1="16" x2="22" y2="16"
        stroke="#fafafc" stroke-width="2.2"
        stroke-linecap="round"/>
  <circle cx="27" cy="16" r="2.2" fill="#2fa36b"/>
  <line x1="14" y1="23" x2="25" y2="23"
        stroke="#fafafc" stroke-width="2.2"
        stroke-linecap="round"/>
</svg>
